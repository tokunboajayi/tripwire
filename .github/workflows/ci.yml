name: ci
on: { pull_request: {}, push: { branches: [main] } }
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cd engine && cargo test --release
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m py_compile $(git ls-files '*.py')
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: cd web && npm ci && npm run build
  tv-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -e tv-mcp pytest pytest-asyncio && cd tv-mcp && pytest -q
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: cd web && npm ci && npm run build
      - run: cd engine && cargo build --release
      - run: pip install httpx pydantic "mcp>=1.12,<2" -e tv-mcp
      - name: start engine (offline fixtures, deterministic)
        run: |
          mkdir -p "$RUNNER_TEMP/vt" && cp data/backtest.json "$RUNNER_TEMP/vt/"
          cd engine && DEV=1 DATA_DIR="$RUNNER_TEMP/vt" MARKET_URL=http://127.0.0.1:9 PORT=8099 nohup ./target/release/vantrel-engine > "$RUNNER_TEMP/engine.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8099/v1/health && exit 0; sleep 1; done; cat "$RUNNER_TEMP/engine.log"; exit 1
      - run: python tests/e2e.py .
      - name: live price stream + ElevenLabs voice (fake upstreams)
        run: python tests/live_feed.py engine/target/release/vantrel-engine
      - name: real-money broker mode against a fake Alpaca (guards, halts, live keys only)
        run: python tests/live_broker.py engine/target/release/vantrel-engine
      - name: prediction-market arbitrage against fake Kalshi + Polymarket (paper + live guards, signed orders)
        run: python tests/pm_arb.py engine/target/release/vantrel-engine
      - name: sign-in on a production-configured engine (no DEV, no Auth0)
        run: python tests/public_signin.py engine/target/release/vantrel-engine
      - name: real-browser user journey on a production-configured engine
        run: |
          mkdir -p "$RUNNER_TEMP/vtp" && cp data/backtest.json "$RUNNER_TEMP/vtp/"
          (cd engine && DATA_DIR="$RUNNER_TEMP/vtp" INTERNAL_TOKEN="$(openssl rand -hex 24)" MARKET_URL=http://127.0.0.1:9 WEB_DIR="$GITHUB_WORKSPACE/web/dist" PORT=8098 \
            nohup ./target/release/vantrel-engine > "$RUNNER_TEMP/engine-prod.log" 2>&1 &)
          for i in $(seq 1 60); do curl -sf localhost:8098/v1/health >/dev/null && break; sleep 1; done
          cd tests/ui && npm install --no-audit --no-fund && npx playwright-core install --with-deps chromium && U=http://localhost:8098 node journey.mjs && U=http://localhost:8098 node reload.mjs && U=http://localhost:8098 node voice.mjs && U=http://localhost:8098 node narration.mjs
      - name: Auth0 build where Auth0 rejects the login -> error shown, guests still get in
        run: |
          (cd web && VITE_AUTH0_DOMAIN=example.us.auth0.com VITE_AUTH0_CLIENT_ID=test VITE_AUTH0_AUDIENCE=https://api.test npx vite build --outDir "$RUNNER_TEMP/dist-auth0")
          mkdir -p "$RUNNER_TEMP/vta" && cp data/backtest.json "$RUNNER_TEMP/vta/"
          (cd engine && DATA_DIR="$RUNNER_TEMP/vta" INTERNAL_TOKEN="$(openssl rand -hex 24)" MARKET_URL=http://127.0.0.1:9 WEB_DIR="$RUNNER_TEMP/dist-auth0" PORT=8097 \
            nohup ./target/release/vantrel-engine > "$RUNNER_TEMP/engine-a0.log" 2>&1 &)
          for i in $(seq 1 60); do curl -sf localhost:8097/v1/health >/dev/null && break; sleep 1; done
          cd tests/ui && U=http://localhost:8097 node auth0.mjs
      - if: failure()
        run: cat "$RUNNER_TEMP/engine.log"; cat "$RUNNER_TEMP/engine-prod.log" 2>/dev/null || true
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vantrel .
      - name: container starts and serves health + dashboard
        run: |
          docker run -d --name vt -p 8080:8080 -e DEV=1 vantrel
          for i in $(seq 1 90); do curl -sf localhost:8080/v1/health && break; sleep 1; done
          curl -sf localhost:8080/v1/health && curl -sf localhost:8080/ | grep -q '<div id="root">' || { docker logs vt; exit 1; }
